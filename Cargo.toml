[package]
name = "llm-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "verify_applier"
path = "src/bin/verify_applier.rs"

[[bin]]
name = "merge"
path = "src/bin/merge.rs"

[[bin]]
name = "llm-edit"
path = "src/bin/llm_edit.rs"

[[bin]]
name = "verify_cli"
path = "src/bin/verify_cli.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "token_savings"
path = "src/bin/token_savings.rs"

[[bin]]
name = "lint_parse"
path = "src/bin/lint_parse.rs"

