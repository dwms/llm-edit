[package]
name = "llm-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "verify_applier"
path = "src/bin/verify_applier.rs"

[[bin]]
name = "merge"
path = "src/bin/merge.rs"

[[bin]]
name = "llm-edit"
path = "src/bin/llm_edit.rs"

[[bin]]
name = "verify_cli"
path = "src/bin/verify_cli.rs"

[lib]
name = "llm_edit"
path = "src/lib.rs"
